name: ci
on: [push, pull_request, workflow_dispatch]

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: make lint

  linux:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: make test

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: .dotfiles }
      - run: mv .dotfiles ~/.dotfiles
      # casks (GUI apps) are skipped to keep the run short
      - run: BREW_NO_CASKS=1 ~/.dotfiles/install.sh packages
      - run: ~/.dotfiles/install.sh link
      - run: ~/.dotfiles/install.sh tools
      - run: SMOKE_ZSH_MAX_MS=3000 ~/.dotfiles/test/smoke.sh # hosted macOS runners are slow
