# Status update interval: the clock shows minutes, Claude marks redraw on their own
set -g status-interval 5

# Basic status bar colors
set -g status-style bg=black,fg=cyan

# Left side of status bar
set -g status-left-style bg=black,fg=green
set -g status-left-length 40
set -g status-left "#S"

# Right side of status bar
set -g status-right-style bg=black,fg=cyan
set -g status-right-length 50
# battery: ~/.config/tmux/battery (empty where there is none)
set -g status-right "#[fg=yellow]%H:%M #[fg=green]%d-%b-%y #(~/.config/tmux/battery)"

# Claude Code state of the window, set by ~/.config/claude-tmux/status.sh from Claude hooks:
# ● working, ✓ finished and not seen yet, ! waits for an answer (permission / question).
# No bold: the terminal renders bold green as bright green, which is grey in this palette.
set -g @claude_mark "#{?#{==:#{@claude_state},working},#[fg=yellow]● ,}#{?#{==:#{@claude_state},done},#[fg=green]✓ ,}#{?#{==:#{@claude_state},ask},#[fg=black]#[bg=red] ! #[bg=black] ,}"

# Window status
set -g window-status-format " #{E:@claude_mark}#[fg=brightcyan]#I:#W#{?window_zoomed_flag,Z,} "
set -g window-status-current-format "#[fg=green,bg=black]➤#{E:@claude_mark}#[fg=green]#I:#W#{?window_zoomed_flag,Z,}"

# Current window status
set -g window-status-current-style bg=green,fg=black

# Window with activity status
set -g window-status-activity-style bg=black,fg=cyan

# Window separator
set -g window-status-separator ""

# Window status alignment
set -g status-justify centre

# Pane border
set -g pane-border-style bg=default,fg=default

# Active pane border
set -g pane-active-border-style bg=default,fg=green

# Pane number indicator
set -g display-panes-colour default
set -g display-panes-active-colour default

# Clock mode
set -g clock-mode-colour red
set -g clock-mode-style 24

# Message
set -g message-style bg=default,fg=default

# Command message
set -g message-command-style bg=default,fg=default

# Mode
set -g mode-style bg=black,fg=default
