set -g mouse on

# set vi mode keys
setw -g mode-keys vi

# toggle statusbar
# bind-key b set-option status
bind S split-window -vf "tmux list-sessions -F '#S' | fzf --reverse | xargs tmux switch-client -t"
bind s switch-client -l

# Start window indexing at one instead of zero
set -g base-index 1

set -g default-terminal "tmux-256color"
# Outer terminal (iTerm2, or the ssh client's): 24-bit colour and OSC 52 clipboard
set -as terminal-features ",xterm*:RGB:clipboard"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'smilovanovic/tmux-claude' # Claude status hooks (~/.claude/sessions/<pid>.status), read by popup.sh

# Theme is sourced before tpm so that tmux-continuum can hook its autosave into status-right.
source-file ~/.config/tmux/theme.conf

set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'iterm'

# Bring Claude Code sessions back after a restore: save.sh records pane -> session id,
# restore.sh runs `claude --resume <id>` in each pane.
set -g @resurrect-hook-post-save-all '~/.config/claude-tmux/save.sh'
set -g @resurrect-hook-post-restore-all '~/.config/claude-tmux/restore.sh'

# Claude Code tab markers (@claude_mark in theme.conf, set by claude-tmux/status.sh from Claude hooks):
# opening a window whose Claude has finished means you have seen it, so drop the ✓.
set-hook -g session-window-changed 'if -F "#{==:#{@claude_state},done}" "set -wu @claude_state"'

# prefix+f: Claude switcher with session topics. tmux-claude's own popup moves to prefix+F,
# so it does not take f back when tpm loads it.
set -g @claude-popup-key 'F'
bind f display-popup -E -w 80% -h 70% "$HOME/.config/claude-tmux/popup.sh"

#tmux-thumbs
set -g @thumbs-position off_left
set -g @thumbs-regexp-1 '([!\w/-]+)' # every word


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf).
# Synchronous (~0.6s), so ru-keys below sees the plugins' bindings.
run '~/.tmux/plugins/tpm/tpm'

# Same bindings on the Russian layout: prefix ы = prefix s, а = f, х = [ … (see the script).
run '~/.config/tmux/ru-keys'

# Auto-kill nvim in inactive sessions after 30 min (saves RAM)
# Override timeout: export TMUX_NVIM_TIMEOUT=900 (seconds)
# Sessions where nvim is never killed; add machine-local ones in ~/.tmux.conf.local:
#   set -ga @nvim-autokill-keep ' my-session'
set -g @nvim-autokill-keep 'education'
set-hook -g client-session-changed 'run-shell -b "~/.config/tmux/nvim-autokill #{session_name}"'

set-option -g set-clipboard on
set-option -g allow-passthrough on

# machine-local overrides (not in git)
source-file -q ~/.tmux.conf.local
